<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK RIZZY X PREDICTION</title>
    <style>
        :root{--glass:rgba(0,255,255,0.08);--border:rgba(0,255,255,0.35);--neon-cyan:#00ffff;--neon-violet:#8a2be2;--cyber-lime:#ccff00;--deep-dark:#0b0c1e;--electric-pink:#ff10f0;--gold:#ffd700;}
        html,body{min-height:100%;margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(rgba(5,8,20,0.38),rgba(5,8,20,0.48)),url("https://i.imghos.co/IIGySwhh.jpg") center center / cover fixed no-repeat;color:#e0f0ff;overflow-x:hidden;user-select:none;-webkit-user-select:none;}
        body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(5,8,20,0.18),rgba(5,8,20,0.25)),url("https://i.imghos.co/IIGySwhh.jpg") center center / cover no-repeat;pointer-events:none;}
        #introScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(rgba(5,8,20,0.35),rgba(5,8,20,0.45)),url("https://i.imghos.co/IIGySwhh.jpg") center center / cover no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10000;transition:opacity 0.8s ease-out;}
        .intro-line{font-size:clamp(20px,6vw,40px);font-weight:800;letter-spacing:3px;white-space:nowrap;text-transform:uppercase;border-right:4px solid var(--neon-cyan);padding-right:12px;animation:typing 2s steps(25),blink 0.5s step-end infinite;overflow:hidden;text-shadow:0 0 20px var(--neon-violet),0 0 40px var(--neon-cyan);color:#ffffff;}
        .intro-line span{color:var(--neon-cyan);text-shadow:0 0 15px var(--neon-cyan);}
        @keyframes typing{from{width:0}to{width:100%}}
        @keyframes blink{from,to{border-color:transparent}50%{border-color:var(--neon-cyan)}}
        .app-frame{max-width:480px;margin:auto;padding:15px;}
        .glass-card{background:rgba(10,20,30,0.58);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--border);border-radius:24px;padding:20px;margin-bottom:20px;box-shadow:0 10px 35px -5px rgba(0,255,255,0.3),inset 0 0 25px rgba(0,255,255,0.04);}
        .header{text-align:center;border-bottom:2px solid var(--neon-cyan);padding-bottom:10px;margin-bottom:20px;}
        .header span:first-child{color:#ffffff;font-weight:800;letter-spacing:2px;}
        .header span:last-child{color:var(--neon-cyan);font-weight:400;}
        .pred-val{font-size:75px;font-weight:900;text-shadow:0 0 25px var(--neon-violet),0 0 45px var(--neon-cyan);margin:10px 0;color:#fff;}
        .timer-display{font-size:26px;color:var(--cyber-lime);font-weight:bold;text-shadow:0 0 10px #ccff00;}
        .status-info{display:flex;justify-content:space-between;font-size:11px;color:var(--neon-cyan);margin-bottom:10px;letter-spacing:0.5px;}
        .strat-mode{font-size:10px;background:rgba(138,43,226,0.25);padding:4px 14px;border-radius:30px;color:var(--cyber-lime);border:1px solid var(--neon-cyan);margin-bottom:12px;display:inline-block;font-weight:600;backdrop-filter:blur(4px);}
        .lvl-badge{background:rgba(0,255,255,0.1);border:1px solid var(--neon-cyan);padding:8px;border-radius:40px;font-weight:bold;margin:15px 0;font-size:13px;color:#fff;box-shadow:0 0 8px var(--neon-cyan);}
        .num-row{display:flex;justify-content:center;gap:30px;}
        .num-circle{width:50px;height:50px;line-height:50px;border:2px solid var(--cyber-lime);border-radius:50%;font-weight:900;background:rgba(0,0,0,0.5);color:var(--cyber-lime);font-size:22px;box-shadow:0 0 15px var(--cyber-lime);}
        .btn-clear{width:100%;padding:12px;background:linear-gradient(90deg,#ff2a5e,#b030b0);border:none;border-radius:40px;color:white;font-weight:800;cursor:pointer;box-shadow:0 0 15px rgba(255,42,94,0.6);text-transform:uppercase;font-size:11px;margin-top:10px;}
        .btn-clear:hover{background:linear-gradient(90deg,#ff1a4f,#9f1f9f);}
        .btn-copy{width:100%;padding:13px;background:linear-gradient(90deg,#00c6ff,#0072ff);border:1px solid var(--neon-cyan);border-radius:40px;color:white;font-weight:900;cursor:pointer;box-shadow:0 0 15px rgba(0,255,255,0.5);text-transform:uppercase;font-size:12px;margin-top:18px;letter-spacing:1px;transition:0.2s;}
        .btn-copy:active{transform:scale(0.97);}
        .cyber-input,.cyber-select{width:100%;box-sizing:border-box;padding:12px 15px;background:rgba(5,12,25,0.85);border:1px solid var(--neon-cyan);border-radius:30px;color:#fff;font-weight:bold;text-align:center;outline:none;margin-bottom:12px;font-size:13px;box-shadow:inset 0 0 10px rgba(0,255,255,0.2);}
        .cyber-select option{background:#0b0c1e;color:var(--neon-cyan);}
        .history-wrap{max-height:400px;overflow-y:auto;border-radius:16px;padding-right:5px;}
        table{width:100%;border-collapse:collapse;font-size:11px;}
        th{color:var(--neon-cyan);padding:10px 4px;border-bottom:1px solid var(--neon-violet);}
        td{padding:8px 4px;border-bottom:1px solid rgba(0,255,255,0.1);text-align:center;}
        .win{color:#ccff00;font-weight:bold;text-shadow:0 0 5px lime;}
        .jackpot{color:var(--gold);font-weight:900;text-shadow:0 0 10px #ffd700,0 0 20px #ff8c00;letter-spacing:0.5px;}
        .loss{color:#ff10f0;font-weight:bold;text-shadow:0 0 5px magenta;}
        .hidden{display:none!important;}
        #pID{color:rgba(200,230,255,0.7);font-size:12px;}
        .key-box{background:rgba(0,255,255,0.1);border:1px dashed var(--cyber-lime);padding:12px;border-radius:15px;margin:12px 0;font-size:14px;font-weight:900;color:var(--cyber-lime);letter-spacing:1px;word-break:break-all;}
        @media(max-width:600px){html,body,body::before,#introScreen{background-attachment:scroll;}}
    </style>
</head>
